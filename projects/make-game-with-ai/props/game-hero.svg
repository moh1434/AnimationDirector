<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- A little 2D action-game character the AI designs (a generic hero; no known mascot):
       round head with a cap, blue tunic with arms, brown boots. House style: flat fills,
       6px ink outline, silhouette fills ~165 of the 200 box. The built-in prop face lands on
       the head centre (eyes ~ y96, brows ~ y81 are kept clear of the cap brim). -->
  <g stroke="#1d1b20" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- body -->
    <rect x="64" y="132" width="72" height="42" rx="15" fill="#3b8df0"/>
    <rect x="46" y="138" width="20" height="34" rx="10" fill="#3b8df0"/>
    <rect x="134" y="138" width="20" height="34" rx="10" fill="#3b8df0"/>
    <rect x="72" y="164" width="20" height="26" rx="10" fill="#8d5a2b"/>
    <rect x="108" y="164" width="20" height="26" rx="10" fill="#8d5a2b"/>
    <!-- head -->
    <circle cx="100" cy="94" r="44" fill="#ffd8b3"/>
    <!-- cap -->
    <path d="M56 72 Q56 26 100 26 Q144 26 144 72 Z" fill="#3ddc97"/>
    <rect x="50" y="62" width="100" height="13" rx="6.5" fill="#3ddc97"/>
  </g>
</svg>
